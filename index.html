<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Otto — Ton Pronote, transformé en plan du jour</title>
    <meta name="description" content="Otto lit ton Pronote et transforme tes devoirs et contrôles en un plan clair pour aujourd'hui — jamais l'exercice à ta place." />
    <meta name="theme-color" content="#EDEEE9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0D10" media="(prefers-color-scheme: dark)" />
    <!-- iOS ignores the web manifest for "add to home screen" — without these, a saved Otto opens inside
         Safari chrome (address bar, back/forward) instead of full-screen like the Android/manifest install. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Otto" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://hiotto.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Otto — Ton Pronote, transformé en plan du jour" />
    <meta property="og:description" content="Otto lit ton Pronote et transforme tes devoirs et contrôles en un plan clair pour aujourd'hui — jamais l'exercice à ta place." />
    <meta property="og:url" content="https://hiotto.vercel.app/" />
    <!-- Must be an ABSOLUTE url and a real raster image — Twitter/X, LinkedIn, and iMessage link previews
         don't reliably render an SVG for a social card the way a browser tab icon does. -->
    <meta property="og:image" content="https://hiotto.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Otto — Ton Pronote, transformé en plan du jour" />
    <meta name="twitter:description" content="Otto lit ton Pronote et transforme tes devoirs et contrôles en un plan clair pour aujourd'hui — jamais l'exercice à ta place." />
    <meta name="twitter:image" content="https://hiotto.vercel.app/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Must be a real PNG — iOS renders an SVG apple-touch-icon as a blank/white home-screen tile. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Self-heal after a deploy — externalized (not inline) so the CSP can stay script-src 'self'. -->
    <script src="/self-heal.js"></script>
    <script type="module" src="/client/main.tsx"></script>
  </body>
</html>
