<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Otto — the voice tutor that never gives you the answer</title>
    <!-- Deliberately NOT Pronote-first: Pronote is one source among several (Gmail/Calendar/Drive, or exams
         the student logs by hand), and a title that named it as the whole premise made the app read as
         unusable to anyone whose school doesn't use it (see the dashboard's own "one option, not the
         premise" copy). The static <head> can't localize per visitor, so this single line has to read
         honestly for both the French Bac crowd (where Pronote is common) and the international/IB crowd
         (where it usually isn't) — hence the source-neutral title and the description that names them all. -->
    <meta name="description" content="Otto is a voice tutor with a shared whiteboard. It asks instead of telling, explains when you're stuck and writes the working as you go. SAT, AP, IB, Bac." />
<meta name="theme-color" content="#FFFFFF" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The tutor board's paper look (Kalam for handwriting, Instrument Serif for titles) — only the Tutor uses them. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Kalam:wght@400;700&display=swap" />
    <!-- Inter is loaded via @import in client/styles.css — no other font families are used. -->

    <!-- iOS ignores the web manifest for "add to home screen" — without these, a saved Otto opens inside
         Safari chrome (address bar, back/forward) instead of full-screen like the Android/manifest install. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Otto" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://hiotto.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Otto — the voice tutor that never gives you the answer" />
    <meta property="og:description" content="Otto is a voice tutor with a shared whiteboard. It asks instead of telling, explains when you're stuck and writes the working as you go. SAT, AP, IB, Bac." />
    <meta property="og:url" content="https://hiotto.vercel.app/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="og:site_name" content="Otto" />
    <!-- Must be an ABSOLUTE url and a real raster image — Twitter/X, LinkedIn, and iMessage link previews
         don't reliably render an SVG for a social card the way a browser tab icon does. -->
    <meta property="og:image" content="https://hiotto.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Otto — the voice tutor that never gives you the answer" />
    <meta name="twitter:description" content="Otto is a voice tutor with a shared whiteboard. It asks instead of telling, explains when you're stuck and writes the working as you go. SAT, AP, IB, Bac." />
    <meta name="twitter:image" content="https://hiotto.vercel.app/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Must be a real PNG — iOS renders an SVG apple-touch-icon as a blank/white home-screen tile. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Structured data (schema.org SoftwareApplication) — every field here must stay factually true to
         the actual product (see DATA_PROTECTION.md's "state what's true today" standard): no fake rating,
         no fake review count, no "free forever" claim beyond what Settings actually enforces (a capped,
         visible monthly AI budget, not literally unlimited free use). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Otto",
      "applicationCategory": "EducationalApplication",
      "inLanguage": ["en", "zh", "hi", "es", "fr", "ar", "pt", "ru", "de", "ja"],
      "featureList": ["Voice tutoring with a shared whiteboard", "Socratic questioning, never hands over answers", "SAT, AP, IB and Bac practice at your level", "Typeset maths, graphs and multiple choice", "Tutor sessions kept in your browser"],
      "operatingSystem": "Web",
      "url": "https://hiotto.vercel.app/",
      "description": "A voice-first Socratic tutor with a shared whiteboard: it asks questions instead of giving answers, explains anything when you are stuck, writes the working on a board, and knows your level, homework and past sessions. Available in 10 languages.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
      "audience": { "@type": "EducationalAudience", "educationalRole": "student" }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Clears the build-time prerendered Landing markup immediately for a returning logged-in visitor —
         must run BEFORE self-heal.js/the module script, synchronously, so it executes during initial HTML
         parsing rather than waiting on the full JS bundle. See the file's own comment for the full story. -->
    <script src="/hide-stale-landing.js"></script>
    <!-- Self-heal after a deploy — externalized (not inline) so the CSP can stay script-src 'self'. -->
    <script src="/self-heal.js"></script>
    <script type="module" src="/client/main.tsx"></script>
  </body>
</html>
