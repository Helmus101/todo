name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (pure-function, no network/AI)
        run: npm test
      - name: Smoke tests (real HTTP against the Express app — auth gating, error handling, no Supabase/AI needed)
        run: npm run test:smoke
      - name: Build
        run: npm run build
      # Blocking at high/critical (verified clean at this threshold as of writing — only pre-existing
      # moderate-severity transitive advisories, e.g. googleapis' uuid dependency, which don't gate this).
      # Was report-only (`|| true`) — a high/critical CVE could ship silently forever with no PR ever
      # actually blocked on it. If a future high/critical advisory is a known false positive or has no fix
      # yet, allowlist it explicitly (`npm audit --audit-level=high --omit-audit-...`/a `.nsprc`-style
      # exception) rather than reintroducing `|| true` here.
      - name: Dependency audit (blocking on high/critical)
        run: npm audit --audit-level=high
